# Temporary loopback-only verification when the fixed preview is occupied.
name: hrm-payroll-verify
services:
  payrollverifyapi:
    image: ${PREVIEW_API_IMAGE:?Run the isolated verification launcher}
    working_dir: /app
    command: ["sh", "-c", "node prisma/preview-guard.cjs && ./node_modules/.bin/prisma generate && ./node_modules/.bin/prisma migrate deploy && npm run build && node dist/src/main.js"]
    env_file: .env.preview.local
    environment:
      NODE_ENV: development
      TZ: Asia/Shanghai
      AI_RESUME_PARSING_ENABLED: "false"
    volumes:
      - ./api:/app
      - verify_api_modules:/app/node_modules
      - ./config/preview-empty.env:/app/.env:ro
    networks: [internal]
  payrollverifyweb:
    image: ${PREVIEW_WEB_IMAGE:?Run the isolated verification launcher}
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]
    environment:
      NODE_ENV: development
      VITE_PREVIEW_MODE: "true"
      VITE_API_BASE_URL: ""
      VITE_DEV_PROXY_TARGET: http://payrollverifyapi:3000
      VITE_DINGTALK_APP_KEY: ""
      VITE_DINGTALK_CORP_ID: ""
      VITE_DINGTALK_REDIRECT_URI: http://localhost:5174/auth/callback
      CHOKIDAR_USEPOLLING: "true"
    ports: ["127.0.0.1:5174:5174"]
    volumes:
      - ./web:/app
      - verify_web_modules:/app/node_modules
    networks: [internal, external]
volumes:
  verify_api_modules:
    external: true
    name: hrm_payroll_verify_api_modules
  verify_web_modules:
    external: true
    name: hrm_payroll_verify_web_modules
networks:
  internal:
    external: true
    name: hrm_internal
  external:
    external: true
    name: hrm_external
